<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DreamboatSoft — Logotipo Cuadrado Oficial (1080x1080)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <!-- html2canvas para exportación 1:1 en Ultra HD -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --brand-magenta: #cd326c;
      --brand-red: #d01926;
      --brand-dark: #111010;
      --brand-light: #fbfbfb;
    }

    body {
      background-color: #060606;
      min-height: 100vh;
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #fbfbfb;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 80px;
    }

    /* Toolbar de control superior */
    .toolbar-container {
      position: sticky;
      top: 16px;
      z-index: 1000;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(18, 17, 18, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(205, 50, 108, 0.4);
      padding: 10px 24px;
      border-radius: 999px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(205, 50, 108, 0.25);
    }

    .toolbar-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .toolbar-badge {
      background: rgba(205, 50, 108, 0.18);
      border: 1px solid rgba(205, 50, 108, 0.5);
      color: #cd326c;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .selector-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .selector-btn.active, .selector-btn:hover {
      background: rgba(205, 50, 108, 0.25);
      border-color: #cd326c;
      color: #fbfbfb;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(90deg, #d01926 0%, #cd326c 100%);
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 999px;
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(208, 25, 38, 0.5);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .download-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 10px 28px rgba(205, 50, 108, 0.7);
    }

    /* CONTENEDOR 1:1 CUADRADO (1080x1080) */
    .logo-canvas {
      width: 1080px;
      height: 1080px;
      min-width: 1080px;
      min-height: 1080px;
      background: #111010;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px;
      box-shadow: 0 35px 90px rgba(0, 0, 0, 0.98), 0 0 80px rgba(205, 50, 108, 0.18);
      border: 1px solid rgba(205, 50, 108, 0.35);
    }

    /* DNA VISUAL */
    .grid-lines {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(205, 50, 108, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(205, 50, 108, 0.04) 1px, transparent 1px);
      background-size: 45px 45px;
      z-index: 1;
      pointer-events: none;
    }

    .center-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 750px;
      height: 750px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(205, 50, 108, 0.28) 0%, rgba(208, 25, 38, 0.12) 45%, transparent 70%);
      z-index: 2;
      pointer-events: none;
    }

    .outer-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 860px;
      height: 860px;
      border-radius: 50%;
      border: 1px dashed rgba(205, 50, 108, 0.25);
      z-index: 2;
      pointer-events: none;
    }

    .corner-tl {
      position: absolute;
      top: 0;
      left: 0;
      width: 8px;
      height: 90px;
      background: #cd326c;
      z-index: 10;
    }
    .corner-tl::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 90px;
      height: 8px;
      background: #cd326c;
    }

    .corner-br {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 8px;
      height: 90px;
      background: #cd326c;
      z-index: 10;
    }
    .corner-br::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 90px;
      height: 8px;
      background: #cd326c;
    }

    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #d01926 0%, #cd326c 50%, #d01926 100%);
      z-index: 10;
    }

    /* CONTENIDO DEL LOGO */
    .logo-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 36px;
    }

    .emblem-wrapper {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 48px;
      background: radial-gradient(circle at 30% 30%, #201e21 0%, #131214 100%);
      border: 2px solid rgba(205, 50, 108, 0.45);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 50px rgba(205, 50, 108, 0.4);
    }

    .emblem-img {
      width: 190px;
      height: 190px;
      object-fit: contain;
      filter: drop-shadow(0 0 24px rgba(205, 50, 108, 0.8));
    }

    .brand-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 64px;
      line-height: 1;
      letter-spacing: -1.5px;
      color: #fbfbfb;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }
    .brand-title .soft {
      color: #cd326c;
      text-shadow: 0 0 35px rgba(205, 50, 108, 0.6);
    }

    .brand-tagline {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-tagline .sep {
      color: #cd326c;
    }

    .origin-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 24px;
      border-radius: 999px;
      background: rgba(205, 50, 108, 0.12);
      border: 1px solid rgba(205, 50, 108, 0.4);
      color: #fbfbfb;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .origin-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #cd326c;
      box-shadow: 0 0 10px #cd326c;
    }
  </style>
</head>
<body>

  <!-- BARRA DE CONTROL SUPERIOR -->
  <div class="toolbar-container">
    <div class="toolbar-info">
      <span class="toolbar-badge">Logo Cuadrado (1:1)</span>
      <span>1080 x 1080 px &bull; DreamboatSoft</span>
    </div>
    <button class="download-btn" onclick="downloadSquareLogo()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Descargar como Imagen (PNG)
    </button>
  </div>

  <!-- LIENZO DEL LOGOTIPO CUADRADO (1080x1080) -->
  <div id="square-logo-canvas" class="logo-canvas">
    <!-- DNA VISUAL DE MARCA -->
    <div class="grid-lines"></div>
    <div class="center-glow"></div>
    <div class="outer-circle"></div>
    <div class="corner-tl"></div>
    <div class="corner-br"></div>
    <div class="bottom-bar"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="logo-content">
      <!-- Emblema Central Icono -->
      <div class="emblem-wrapper">
        <img class="emblem-img" src="favicon.webp" alt="DreamboatSoft Emblem" width="190" height="190">
      </div>

      <!-- Tipografía y Nombre Oficial -->
      <div class="brand-group">
        <h1 class="brand-title">
          Dreamboat<span class="soft">Soft</span>
        </h1>
        <div class="brand-tagline">
          <span>Software a Medida</span>
          <span class="sep">&bull;</span>
          <span>Automatización</span>
        </div>
      </div>

      <!-- Badge de Origen y Prestigio -->
      <div class="origin-badge">
        <span class="dot"></span>
        <span>Medellín &bull; Colombia &bull; LATAM</span>
      </div>
    </div>
  </div>

  <script>
    async function downloadSquareLogo() {
      const target = document.getElementById('square-logo-canvas');
      if (document.fonts) {
        await document.fonts.ready;
      }
      
      const canvas = await html2canvas(target, {
        scale: 2, // Ultra HD (2160x2160)
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#111010',
        logging: false
      });

      const link = document.createElement('a');
      link.download = 'dreamboatsoft-logotipo-cuadrado-1080x1080.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
